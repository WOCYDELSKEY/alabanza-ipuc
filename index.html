<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Alabanza IPUC Líbano Central</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header class="header">
        <div class="header-content">
            <div>
                <h1>🎶 Alabanza IPUC</h1>
                <p>Líbano Central</p>
            </div>

            <span class="status">Sistema activo</span>
        </div>
    </header>


   <main class="contenedor">

    <section class="encabezado-pagina">
        <div>
            <h1>📅 Cronograma de Alabanza</h1>
            <p>IPUC Líbano Central · Octubre 2026</p>
        </div>

        <button class="btn-recargar" onclick="cargarCronograma()">
            🔄 Actualizar
        </button>
    </section>

    <div id="estadoCronograma" class="estado">
        Cargando cronograma...
    </div>

    <section id="cronograma" class="cronograma">
        <!-- Aquí se cargará el cronograma desde Supabase -->
    </section>

</main>


    <footer>
        <p>
            © 2026 Alabanza IPUC Líbano Central
        </p>
    </footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/app.js"></script>

</body>
</html>
