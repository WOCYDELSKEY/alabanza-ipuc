<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmación · Alabanza IPUC</title>
    <link rel="stylesheet" href="css/confirmacion.css">
</head>
<body>
    <main class="confirmacion-page">
        <section class="confirmacion-card" id="confirmacionCard">
            <div class="logo">🎶</div>
            <p class="eyebrow">ALABANZA IPUC LÍBANO CENTRAL</p>
            <h1>Confirmación de servicio</h1>

            <div id="estadoCarga" class="estado-carga">
                <div class="spinner"></div>
                <p>Cargando tu asignación...</p>
            </div>

            <div id="contenidoConfirmacion" class="contenido-confirmacion oculto">
                <div class="saludo">
                    Hola, <strong id="nombreIntegrante"></strong> 👋
                </div>

                <div class="servicio-info">
                    <div class="info-item">
                        <span class="info-icono">📅</span>
                        <div>
                            <span class="info-label">Servicio</span>
                            <strong id="fechaServicio"></strong>
                        </div>
                    </div>

                    <div class="info-item">
                        <span class="info-icono">🕐</span>
                        <div>
                            <span class="info-label">Hora</span>
                            <strong id="horaServicio"></strong>
                        </div>
                    </div>

                    <div class="info-item">
                        <span class="info-icono">🎵</span>
                        <div>
                            <span class="info-label">Tu asignación</span>
                            <strong id="rolServicio"></strong>
                        </div>
                    </div>
                </div>

                <p class="pregunta">
                    ¿Puedes participar en este servicio?
                </p>

                <div class="acciones">
                    <button id="btnConfirmar" class="btn btn-confirmar" type="button">
                        <span>✅</span>
                        <span>CONFIRMO</span>
                    </button>

                    <button id="btnNoPuedo" class="btn btn-no-puedo" type="button">
                        <span>❌</span>
                        <span>NO PUEDO</span>
                    </button>
                </div>

                <div id="mensajeResultado" class="mensaje-resultado oculto"></div>
            </div>

            <div id="estadoError" class="estado-error oculto">
                <div class="error-icono">⚠️</div>
                <h2>No fue posible cargar la asignación</h2>
                <p id="mensajeError">El enlace puede ser incorrecto o haber expirado.</p>
            </div>

            <footer class="confirmacion-footer">
                Dios les bendiga 🙏<br>
                <span>IPUC Líbano Central</span>
            </footer>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/confirmacion.js"></script>
</body>
</html>
