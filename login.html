<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · Alabanza IPUC Líbano Central</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f3f6fb}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    .login-card{width:min(100%,430px);background:#fff;border:1px solid #e1e7f0;border-radius:22px;padding:32px;box-shadow:0 18px 50px rgba(22,34,60,.10)}
    .logo{width:58px;height:58px;border-radius:17px;background:#eef4ff;display:grid;place-items:center;font-size:29px;margin-bottom:18px}
    h1{font-size:1.55rem;margin:0 0 8px}p{color:#596579;line-height:1.5;margin:0 0 22px}
    label{display:block;font-size:.92rem;font-weight:650;margin:16px 0 7px}input{width:100%;padding:12px 13px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}
    input:focus{outline:3px solid #dbeafe;border-color:#4778d0}button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:10px;background:#174ea6;color:white;font:inherit;font-weight:700;cursor:pointer}
    button:disabled{opacity:.65;cursor:wait}.msg{margin-top:16px;padding:11px 12px;border-radius:9px;background:#f8fafc;color:#334155;white-space:pre-wrap;font-size:.92rem}.msg.error{background:#fef2f2;color:#991b1b}.small{font-size:.82rem;margin-top:18px;margin-bottom:0}
  </style>
</head>
<body>
  <main class="login-card">
    <div class="logo" aria-hidden="true">🎶</div>
    <h1>Alabanza IPUC</h1>
    <p>Líbano Central · Acceso administrativo</p>
    <form id="loginForm">
      <label for="email">Correo electrónico</label>
      <input id="email" name="email" type="email" autocomplete="username" required>
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button id="btnLogin" type="submit">Iniciar sesión</button>
    </form>
    <div id="loginMessage" class="msg" role="status" aria-live="polite">Usa la cuenta que fue autorizada como administradora.</div>
    <p class="small">Si no tienes una cuenta, solicita al administrador que la cree en Supabase. No hay registro público.</p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
