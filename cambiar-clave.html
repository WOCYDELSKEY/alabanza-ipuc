<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cambiar contraseña · Alabanza IPUC</title><link rel="stylesheet" href="css/styles.css"><style>body{min-height:100vh;display:grid;place-items:center;background:#f1f5f9}.caja{width:min(440px,92vw);background:white;padding:28px;border-radius:18px;box-shadow:0 16px 45px #0f172a18}.caja label{display:block;margin:14px 0;font-weight:600}.caja input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:9px;margin-top:6px}.caja button{width:100%;padding:12px;border:0;border-radius:9px;background:#1d4ed8;color:white;font-weight:700;cursor:pointer}.msg{color:#b91c1c}</style></head><body><main class="caja"><h1>🔐 Cambia tu contraseña</h1><p>Por seguridad, debes reemplazar la contraseña temporal antes de continuar.</p><form id="formClave"><label>Nueva contraseña<input id="nuevaClave" type="password" minlength="8" autocomplete="new-password" required></label><label>Confirmar contraseña<input id="confirmarClave" type="password" minlength="8" autocomplete="new-password" required></label><button id="btnGuardarClave">Guardar contraseña</button></form><p id="msgClave" class="msg" role="status"></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/cambiar-clave.js"></script></body></html>
